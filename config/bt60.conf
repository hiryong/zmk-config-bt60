# BT60 V2 — template from key.ryong.com. Switch these on key.ryong.com → Combos & Macros → Settings.
CONFIG_ZMK_KEYBOARD_NAME="BT60 V2"

# Lights: off until you switch them on (the board has both)
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_RGB_UNDERGLOW=n

# Power: Soft Off key (Fn + Left Ctrl), sleep after 15 minutes idle
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
